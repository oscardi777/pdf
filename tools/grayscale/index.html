<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PDF a escala de grises · Utilidades PDF</title>
  <link rel="stylesheet" href="../../styles.css" />
</head>
<body>
  <main class="contenedor">
    <a class="volver" href="../../index.html">← Volver a utilidades</a>

    <header class="hero">
      <h1>🌓 PDF a escala de grises</h1>
      <p class="intro">
        Convierte cualquier PDF a escala de grises directamente en tu navegador.
        El archivo nunca se sube a ningún servidor.
      </p>
    </header>

    <section class="caja">
      <label class="dropzone" id="dropzone">
        <input type="file" id="inputPdf" accept="application/pdf" hidden />
        <span id="labelDrop">Arrastra un PDF aquí o haz clic para elegirlo</span>
      </label>

      <div class="controles">
        <label for="dpi">Calidad (DPI):</label>
        <input type="number" id="dpi" value="200" min="72" max="400" step="10" />
        <button id="btnConvertir" disabled>Convertir a grises</button>
      </div>

      <div class="estado" id="estado"></div>
      <progress id="progreso" max="100" value="0" hidden></progress>

      <a id="descarga" class="descarga" hidden download>⬇️ Descargar PDF en grises</a>
    </section>
  </main>

  <!-- Librerías por CDN: no requieren instalación -->
  <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <script src="grayscale.js" type="module"></script>
</body>
</html>
